# fly.toml app configuration file generated for badgemasterfree on 2026-10-12T13:21:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'badgemasterfree'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  FRONTEND_URL = 'https://brunnojob.github.io/BadgeMasterfree/'
  NODE_ENV = 'production'
  PORT = '8080'
  COMMUNITY_DB_PATH = '/data/community.sqlite'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[mounts]
  source = 'community_data'
  destination = '/data'
  initial_size = '1gb'
